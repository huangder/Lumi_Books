<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMI — Dream (Enhanced)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .text-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 100;
    }

    .title {
      font-size: clamp(80px, 10vw, 120px);
      font-weight: 200;
      letter-spacing: -0.03em;
      color: #ffffff;
      opacity: 0;
      transform: translateY(30px);
      text-shadow: 0 0 40px rgba(255, 255, 255, 0.3);
    }

    .subtitle {
      font-size: clamp(48px, 6vw, 72px);
      font-weight: 100;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.7);
      opacity: 0;
      transform: translateY(20px);
      margin-top: 20px;
      text-transform: uppercase;
    }

    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 0.2em;
    }

    .progress {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      z-index: 99;
    }

    .progress-bar {
      height: 100%;
      background: rgba(255, 255, 255, 0.5);
      width: 0%;
      transition: width 0.3s ease;
    }

  </style>
</head>
<body>
  <div class="loading">LOADING...</div>
  <canvas id="canvas"></canvas>
  <div class="text-overlay">
    <div class="title">LUMI</div>
    <div class="subtitle">Dream</div>
  </div>
  <div class="progress">
    <div class="progress-bar"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
    // =============================================
    // ANIMATION PARAMETERS - TUNED FOR APPLE FEEL
    // =============================================
    const CONFIG = {
      // Duration (total ~30s)
      shot01Duration: 4.0,
      shot02Duration: 4.5,
      shot03Duration: 5.0,
      shot04Duration: 4.0,
      shot05Duration: 4.5,
      shot06Duration: 5.0,
      shot07Duration: 4.0,

      // Camera
      cameraFov: 50,
      cameraInitialZ: 18,

      // Visual Quality
      bloom: {
        strength: 0.4,
        radius: 0.8,
        threshold: 0.1
      },
      glassOpacity: 0.12,
      glassTransmission: 0.95,
      lightIntensity: 0.8,
      ambientIntensity: 0.3,

      // Animation Easing (Apple-style)
      easeInOut: 'power2.inOut',
      easeOut: 'power3.out',
      easeIn: 'power2.in',
      elastic: 'elastic.out(1, 0.5)',

      // Effects
      vignette: 0.4,
      grain: 0.03
    };

    // =============================================
    // SCENE SETUP
    // =============================================
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.015);

    const camera = new THREE.PerspectiveCamera(
      CONFIG.cameraFov,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.z = CONFIG.cameraInitialZ;

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.outputEncoding = THREE.sRGBEncoding;

    // =============================================
    // POST-PROCESSING
    // =============================================
    const composer = new THREE.EffectComposer(renderer);
    const renderPass = new THREE.RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new THREE.UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      CONFIG.bloom.strength,
      CONFIG.bloom.radius,
      CONFIG.bloom.threshold
    );
    composer.addPass(bloomPass);

    // Custom vignette shader
    const vignetteShader = {
      uniforms: {
        tDiffuse: { value: null },
        vignette: { value: CONFIG.vignette },
        grain: { value: CONFIG.grain },
        time: { value: 0.0 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float vignette;
        uniform float grain;
        uniform float time;
        varying vec2 vUv;

        float random(vec2 co) {
          return fract(sin(dot(co.xy, vec2(12.9898, 78.233))) * 43758.5453);
        }

        void main() {
          vec4 color = texture2D(tDiffuse, vUv);

          // Vignette
          vec2 center = vUv - 0.5;
          float dist = length(center);
          float vig = smoothstep(0.8, 0.2, dist) * (1.0 - vignette) + vignette;
          color.rgb *= vig;

          // Grain
          float grainValue = random(vUv + time) * grain;
          color.rgb += grainValue;

          gl_FragColor = color;
        }
      `
    };

    const vignettePass = new THREE.ShaderPass(vignetteShader);
    composer.addPass(vignettePass);

    // =============================================
    // LIGHTING - REFINED
    // =============================================
    const ambientLight = new THREE.AmbientLight(0xffffff, CONFIG.ambientIntensity);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, CONFIG.lightIntensity);
    keyLight.position.set(8, 6, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x6699ff, 0.25);
    rimLight.position.set(-5, 3, -8);
    scene.add(rimLight);

    const fillLight = new THREE.PointLight(0xff9966, 0.15, 50);
    fillLight.position.set(-8, -2, 5);
    scene.add(fillLight);

    // Subtle back light
    const backLight = new THREE.SpotLight(0xffffff, 0.3, 100, Math.PI / 6, 0.5, 2);
    backLight.position.set(0, 10, -10);
    scene.add(backLight);

    // =============================================
    // MATERIALS - ENHANCED
    // =============================================

    // Enhanced glass material
    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      metalness: 0.0,
      roughness: 0.05,
      transparent: true,
      opacity: CONFIG.glassOpacity,
      transmission: CONFIG.glassTransmission,
      thickness: 0.8,
      envMapIntensity: 1.5,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      ior: 1.5,
      reflectivity: 0.5
    });

    // Paper/Page material
    const pageMaterial = new THREE.MeshStandardMaterial({
      color: 0xf8f8f5,
      roughness: 0.85,
      metalness: 0.0,
      side: THREE.DoubleSide,
      emissive: 0xffffff,
      emissiveIntensity: 0.02
    });

    // Dark cover material
    const coverMaterial = new THREE.MeshStandardMaterial({
      color: 0x1a1a1a,
      roughness: 0.4,
      metalness: 0.2
    });

    // =============================================
    // SHOT 01 & 02 — LUMI ICON
    // =============================================
    const lumiIcon = new THREE.Group();

    // Main icon ring - refined geometry
    const iconRing = new THREE.Mesh(
      new THREE.TorusGeometry(1.8, 0.18, 32, 128),
      glassMaterial.clone()
    );
    iconRing.material.opacity = 0;
    lumiIcon.add(iconRing);

    // Inner glow sphere
    const glowSphere = new THREE.Mesh(
      new THREE.SphereGeometry(1.5, 64, 64),
      new THREE.MeshBasicMaterial({
        color: 0xff6b9d,
        transparent: true,
        opacity: 0
      })
    );
    lumiIcon.add(glowSphere);

    // Subtle ring particles
    const particleCount = 50;
    const particleGeometry = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
      const angle = (i / particleCount) * Math.PI * 2;
      const radius = 1.8;
      particlePositions[i * 3] = Math.cos(angle) * radius;
      particlePositions[i * 3 + 1] = Math.sin(angle) * radius;
      particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 0.1;
    }

    particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

    const particleMaterial = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.05,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending
    });

    const particles = new THREE.Points(particleGeometry, particleMaterial);
    lumiIcon.add(particles);

    scene.add(lumiIcon);

    // =============================================
    // SHOT 03 — BOOK
    // =============================================
    const book = new THREE.Group();

    // Book cover with subtle details
    const cover = new THREE.Mesh(
      new THREE.BoxGeometry(3.2, 4.5, 0.25),
      coverMaterial
    );
    cover.castShadow = true;
    cover.receiveShadow = true;
    book.add(cover);

    // Book pages with realistic stack
    const pageCount = 8;
    const pages = [];

    for (let i = 0; i < pageCount; i++) {
      const page = new THREE.Mesh(
        new THREE.PlaneGeometry(3.0, 4.3),
        pageMaterial.clone()
      );
      page.position.set(-0.05 * i, 0, 0.13 + i * 0.015);
      page.rotation.y = 0;
      page.castShadow = true;
      page.receiveShadow = true;
      pages.push(page);
      book.add(page);
    }

    book.visible = false;
    book.rotation.x = -0.1;
    scene.add(book);

    // =============================================
    // SHOT 04 — READING INTERFACE
    // =============================================
    const readerInterface = new THREE.Group();

    // Main screen plane
    const screen = new THREE.Mesh(
      new THREE.PlaneGeometry(7, 9.5),
      new THREE.MeshStandardMaterial({
        color: 0xfafaf8,
        roughness: 0.95,
        metalness: 0.0
      })
    );
    screen.receiveShadow = true;
    readerInterface.add(screen);

    // Text lines with varying lengths (more realistic)
    const textLines = [];
    const lineLengths = [0.9, 0.95, 0.88, 0.92, 0.85, 0.93, 0.87, 0.91, 0.89, 0.94, 0.86, 0.9];

    for (let i = 0; i < 12; i++) {
      const lineWidth = 5.0 * lineLengths[i];
      const line = new THREE.Mesh(
        new THREE.PlaneGeometry(lineWidth, 0.12),
        new THREE.MeshBasicMaterial({ color: 0x1a1a1a })
      );
      line.position.set(0, 3.2 - i * 0.55, 0.01);
      textLines.push(line);
      readerInterface.add(line);
    }

    readerInterface.visible = false;
    scene.add(readerInterface);

    // =============================================
    // SHOT 05 — FILE FORMATS
    // =============================================
    const fileFormats = new THREE.Group();
    const formats = ['EPUB', 'PDF', 'MOBI', 'TXT', 'MD', 'CBZ'];
    const formatCards = [];

    formats.forEach((fmt, i) => {
      const card = new THREE.Mesh(
        new THREE.PlaneGeometry(1.4, 1.8, 8, 8),
        new THREE.MeshStandardMaterial({
          color: 0xf5f5f5,
          roughness: 0.7,
          metalness: 0.0
        })
      );
      card.position.set((i - 2.5) * 1.8, 0, 0);
      card.castShadow = true;
      formatCards.push(card);
      fileFormats.add(card);
    });

    fileFormats.visible = false;
    scene.add(fileFormats);

    // =============================================
    // SHOT 06 — LIQUID GLASS UI
    // =============================================
    const glassUI = new THREE.Group();
    const glassPanels = [];

    for (let i = 0; i < 3; i++) {
      const panel = new THREE.Mesh(
        new THREE.PlaneGeometry(5, 3),
        glassMaterial.clone()
      );
      panel.material.opacity = 0;
      panel.position.set(0, (1 - i) * 2.0, i * 0.8);
      glassPanels.push(panel);
      glassUI.add(panel);
    }

    glassUI.visible = false;
    scene.add(glassUI);

    // =============================================
    // UI ELEMENTS
    // =============================================
    const titleEl = document.querySelector('.title');
    const subtitleEl = document.querySelector('.subtitle');
    const loadingEl = document.querySelector('.loading');
    const progressBar = document.querySelector('.progress-bar');

    // =============================================
    // ANIMATION TIMELINE - REFINED
    // =============================================
    const timeline = gsap.timeline({
      onStart: () => {
        loadingEl.style.display = 'none';
      },
      onUpdate: function() {
        const progress = this.progress() * 100;
        progressBar.style.width = progress + '%';
        vignetteShader.uniforms.time.value = this.time();
      }
    });

    let t = 0;

    // ========== SHOT 01 — BLACK / LIGHT ==========
    timeline.to(keyLight.position, {
      x: 2,
      y: 8,
      z: 3,
      duration: CONFIG.shot01Duration,
      ease: CONFIG.easeInOut
    }, t);

    timeline.to(iconRing.material, {
      opacity: CONFIG.glassOpacity * 1.2,
      duration: CONFIG.shot01Duration * 0.7,
      ease: CONFIG.easeOut
    }, t + CONFIG.shot01Duration * 0.25);

    timeline.to(particleMaterial, {
      opacity: 0.4,
      duration: CONFIG.shot01Duration * 0.6,
      ease: CONFIG.easeOut
    }, t + CONFIG.shot01Duration * 0.3);

    timeline.to(camera.position, {
      z: 14,
      duration: CONFIG.shot01Duration,
      ease: CONFIG.easeInOut
    }, t);

    t += CONFIG.shot01Duration;

    // ========== SHOT 02 — LUMI ICON ==========
    timeline.to(glowSphere.material, {
      opacity: 0.18,
      duration: 2.0,
      ease: CONFIG.easeInOut
    }, t);

    timeline.to(lumiIcon.rotation, {
      y: Math.PI * 0.6,
      z: Math.PI * 0.15,
      duration: CONFIG.shot02Duration,
      ease: CONFIG.easeInOut
    }, t);

    // Subtle breathing
    timeline.to(iconRing.scale, {
      x: 1.03,
      y: 1.03,
      z: 1.03,
      duration: 1.8,
      yoyo: true,
      repeat: 1,
      ease: 'sine.inOut'
    }, t + 0.5);

    // Particle rotation
    timeline.to(particles.rotation, {
      z: Math.PI * 0.5,
      duration: CONFIG.shot02Duration,
      ease: 'none'
    }, t);

    t += CONFIG.shot02Duration;

    // ========== SHOT 03 — BOOK TRANSFORMATION ==========
    timeline.to([iconRing.material, glowSphere.material, particleMaterial], {
      opacity: 0,
      duration: 1.2,
      ease: CONFIG.easeIn
    }, t);

    timeline.to(lumiIcon.scale, {
      x: 0.3,
      y: 0.3,
      z: 0.3,
      duration: 1.0,
      ease: CONFIG.easeIn
    }, t);

    timeline.set(book, { visible: true }, t + 0.8);
    timeline.set(lumiIcon, { visible: false }, t + 0.8);

    timeline.from(book.scale, {
      x: 0.1,
      y: 0.1,
      z: 0.1,
      duration: 1.8,
      ease: CONFIG.elastic
    }, t + 0.8);

    timeline.to(book.rotation, {
      x: -0.2,
      y: 0.15,
      duration: 1.5,
      ease: CONFIG.easeOut
    }, t + 1.0);

    // Elegant page turn with stagger
    pages.forEach((page, i) => {
      timeline.to(page.rotation, {
        y: -Math.PI * 0.95,
        duration: 1.6,
        ease: CONFIG.easeInOut
      }, t + 2.2 + i * 0.25);
    });

    timeline.to(camera.position, {
      z: 9,
      y: 0.5,
      duration: CONFIG.shot03Duration,
      ease: CONFIG.easeInOut
    }, t);

    t += CONFIG.shot03Duration;

    // ========== SHOT 04 — READING INTERFACE ==========
    timeline.to(book.scale, {
      x: 0,
      y: 0,
      z: 0,
      duration: 1.0,
      ease: CONFIG.easeIn,
      onComplete: () => { book.visible = false; }
    }, t);

    timeline.set(readerInterface, { visible: true }, t + 0.6);

    timeline.from(readerInterface.scale, {
      x: 0.6,
      y: 0.6,
      z: 0.6,
      duration: 1.5,
      ease: CONFIG.easeOut
    }, t + 0.6);

    // Text lines appear with natural delay
    textLines.forEach((line, i) => {
      timeline.from(line.scale, {
        x: 0,
        duration: 0.8,
        ease: CONFIG.easeOut
      }, t + 1.2 + i * 0.06);
    });

    // Gentle upward scroll
    timeline.to(readerInterface.position, {
      y: 1.2,
      duration: CONFIG.shot04Duration * 0.7,
      ease: CONFIG.easeInOut
    }, t + CONFIG.shot04Duration * 0.3);

    t += CONFIG.shot04Duration;

    // ========== SHOT 05 — FILE FORMATS ==========
    timeline.to(readerInterface.scale, {
      x: 0,
      y: 0,
      z: 0,
      duration: 1.0,
      ease: CONFIG.easeIn,
      onComplete: () => { readerInterface.visible = false; }
    }, t);

    timeline.set(fileFormats, { visible: true }, t + 0.4);

    formatCards.forEach((card, i) => {
      timeline.from(card.position, {
        z: -8,
        y: 5,
        duration: 1.5,
        ease: CONFIG.easeOut
      }, t + 0.6 + i * 0.18);

      timeline.from(card.rotation, {
        x: Math.PI * 0.5,
        duration: 1.5,
        ease: CONFIG.easeOut
      }, t + 0.6 + i * 0.18);

      // Float animation
      timeline.to(card.position, {
        y: Math.sin(i * 0.8) * 0.3,
        duration: 2.0,
        yoyo: true,
        repeat: -1,
        ease: 'sine.inOut'
      }, t + 2.0 + i * 0.1);
    });

    timeline.to(fileFormats.rotation, {
      y: Math.PI * 0.15,
      duration: CONFIG.shot05Duration * 0.8,
      ease: CONFIG.easeInOut
    }, t + CONFIG.shot05Duration * 0.2);

    t += CONFIG.shot05Duration;

    // ========== SHOT 06 — LIQUID GLASS ==========
    timeline.to(fileFormats, {
      opacity: 0,
      duration: 1.2,
      ease: CONFIG.easeIn,
      onComplete: () => { fileFormats.visible = false; }
    }, t);

    timeline.set(glassUI, { visible: true }, t + 0.5);

    glassPanels.forEach((panel, i) => {
      timeline.from(panel.position, {
        y: -4,
        z: -3,
        duration: 2.0,
        ease: CONFIG.easeOut
      }, t + 1.0 + i * 0.3);

      timeline.to(panel.material, {
        opacity: CONFIG.glassOpacity * (1.2 - i * 0.2),
        duration: 1.5,
        ease: CONFIG.easeOut
      }, t + 1.0 + i * 0.3);

      // Subtle breathing
      timeline.to(panel.scale, {
        x: 1.02,
        y: 1.02,
        duration: 3.0,
        yoyo: true,
        repeat: -1,
        ease: 'sine.inOut'
      }, t + 2.0);
    });

    timeline.to(camera.position, {
      z: 5,
      y: 0,
      duration: CONFIG.shot06Duration,
      ease: CONFIG.easeInOut
    }, t);

    timeline.to(glassUI.rotation, {
      y: Math.PI * 0.1,
      duration: CONFIG.shot06Duration,
      ease: CONFIG.easeInOut
    }, t);

    t += CONFIG.shot06Duration;

    // ========== SHOT 07 — DREAM ==========
    timeline.to(glassUI, {
      opacity: 0,
      duration: 2.0,
      ease: CONFIG.easeIn
    }, t);

    timeline.to(bloomPass, {
      strength: 0.8,
      duration: 2.0,
      ease: CONFIG.easeInOut
    }, t);

    timeline.to(titleEl, {
      opacity: 1,
      y: 0,
      duration: 2.5,
      ease: CONFIG.easeOut
    }, t + 0.8);

    timeline.to(subtitleEl, {
      opacity: 1,
      y: 0,
      duration: 2.5,
      ease: CONFIG.easeOut
    }, t + 1.5);

    timeline.to(camera.position, {
      z: 25,
      duration: CONFIG.shot07Duration,
      ease: CONFIG.easeInOut
    }, t);

    timeline.to([titleEl, subtitleEl], {
      opacity: 0,
      duration: 1.8,
      ease: CONFIG.easeIn
    }, t + CONFIG.shot07Duration - 2.0);

    timeline.to(progressBar, {
      opacity: 0,
      duration: 0.5
    }, t + CONFIG.shot07Duration - 0.5);

    // =============================================
    // RENDER LOOP
    // =============================================
    let frameCount = 0;

    function animate() {
      requestAnimationFrame(animate);
      frameCount++;

      // Subtle continuous rotations
      if (lumiIcon.visible) {
        lumiIcon.rotation.y += 0.0015;
        particles.rotation.z += 0.002;
      }

      if (glassUI.visible) {
        glassPanels.forEach((panel, i) => {
          panel.position.y += Math.sin(frameCount * 0.01 + i) * 0.001;
        });
      }

      composer.render();
    }

    // =============================================
    // WINDOW RESIZE
    // =============================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    // =============================================
    // CONTROLS
    // =============================================
    document.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') {
        timeline.restart();
      }
      if (e.key === ' ') {
        timeline.paused() ? timeline.play() : timeline.pause();
      }
    });

    // =============================================
    // START
    // =============================================
    animate();

    // Auto-start after brief delay
    setTimeout(() => {
      timeline.play();
    }, 800);

  </script>
</body>
</html>
