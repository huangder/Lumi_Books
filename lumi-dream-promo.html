<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMI — Dream</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .text-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 100;
    }

    .title {
      font-size: 120px;
      font-weight: 200;
      letter-spacing: -0.03em;
      color: #ffffff;
      opacity: 0;
      transform: translateY(30px);
    }

    .subtitle {
      font-size: 72px;
      font-weight: 100;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.7);
      opacity: 0;
      transform: translateY(20px);
      margin-top: 20px;
    }

    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 0.1em;
    }

  </style>
</head>
<body>
  <div class="loading">LOADING...</div>
  <canvas id="canvas"></canvas>
  <div class="text-overlay">
    <div class="title">LUMI</div>
    <div class="subtitle">Dream</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
    // =============================================
    // ANIMATION PARAMETERS
    // =============================================
    const CONFIG = {
      // Duration
      totalDuration: 28,
      shot01Duration: 3.5,
      shot02Duration: 4.0,
      shot03Duration: 4.5,
      shot04Duration: 3.5,
      shot05Duration: 4.0,
      shot06Duration: 4.5,
      shot07Duration: 4.0,

      // Camera
      cameraFov: 45,
      cameraSpeed: 0.3,

      // Visual
      bloom: 0.3,
      glassOpacity: 0.08,
      glassBlur: 20,
      lightIntensity: 1.2,
      ambientIntensity: 0.4,

      // Animation
      springStiffness: 100,
      springDamping: 20,
      pageRotationSpeed: 0.5,

      // Effects
      grainAmount: 0.02,
      vignetteStrength: 0.3,
      depthOfField: 0.15
    };

    // =============================================
    // SCENE SETUP
    // =============================================
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.Fog(0x000000, 10, 50);

    const camera = new THREE.PerspectiveCamera(
      CONFIG.cameraFov,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.z = 15;

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    // =============================================
    // LIGHTING
    // =============================================
    const ambientLight = new THREE.AmbientLight(0xffffff, CONFIG.ambientIntensity);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, CONFIG.lightIntensity);
    keyLight.position.set(5, 5, 5);
    keyLight.castShadow = true;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x88bbff, 0.3);
    rimLight.position.set(-3, 2, -5);
    scene.add(rimLight);

    const fillLight = new THREE.PointLight(0xffffff, 0.2, 100);
    fillLight.position.set(-5, 0, 3);
    scene.add(fillLight);

    // =============================================
    // MATERIALS
    // =============================================
    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      metalness: 0.1,
      roughness: 0.05,
      transparent: true,
      opacity: CONFIG.glassOpacity,
      transmission: 0.9,
      thickness: 0.5,
      envMapIntensity: 1.0,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1
    });

    const pageMaterial = new THREE.MeshStandardMaterial({
      color: 0xf5f5f0,
      roughness: 0.8,
      metalness: 0.0,
      side: THREE.DoubleSide
    });

    // =============================================
    // LUMI ICON (SHOT 01 & 02)
    // =============================================
    const lumiIcon = new THREE.Group();

    // Simple geometric representation of LUMI icon
    const iconGeometry = new THREE.TorusGeometry(1.5, 0.15, 16, 100);
    const iconMesh = new THREE.Mesh(iconGeometry, glassMaterial.clone());
    iconMesh.material.opacity = 0;
    lumiIcon.add(iconMesh);

    // Inner glow
    const glowGeometry = new THREE.SphereGeometry(1.3, 32, 32);
    const glowMaterial = new THREE.MeshBasicMaterial({
      color: 0xff6b9d,
      transparent: true,
      opacity: 0
    });
    const glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
    lumiIcon.add(glowMesh);

    lumiIcon.position.z = 0;
    scene.add(lumiIcon);

    // =============================================
    // BOOK (SHOT 03)
    // =============================================
    const book = new THREE.Group();

    // Book cover
    const coverGeo = new THREE.BoxGeometry(3, 4, 0.2);
    const coverMat = new THREE.MeshStandardMaterial({
      color: 0x1a1a1a,
      roughness: 0.3,
      metalness: 0.1
    });
    const cover = new THREE.Mesh(coverGeo, coverMat);
    book.add(cover);

    // Pages
    const pages = [];
    for (let i = 0; i < 5; i++) {
      const pageGeo = new THREE.PlaneGeometry(2.8, 3.8);
      const page = new THREE.Mesh(pageGeo, pageMaterial.clone());
      page.position.set(-0.05 * i, 0, 0.1 + i * 0.02);
      page.rotation.y = 0;
      pages.push(page);
      book.add(page);
    }

    book.visible = false;
    book.position.z = 0;
    scene.add(book);

    // =============================================
    // READING INTERFACE (SHOT 04)
    // =============================================
    const readerInterface = new THREE.Group();

    // Reader screen
    const screenGeo = new THREE.PlaneGeometry(6, 8);
    const screenMat = new THREE.MeshStandardMaterial({
      color: 0xfafaf8,
      roughness: 0.9
    });
    const screen = new THREE.Mesh(screenGeo, screenMat);
    readerInterface.add(screen);

    // Text lines simulation
    const textLines = [];
    for (let i = 0; i < 12; i++) {
      const lineGeo = new THREE.PlaneGeometry(4.5, 0.08);
      const lineMat = new THREE.MeshBasicMaterial({ color: 0x2a2a2a });
      const line = new THREE.Mesh(lineGeo, lineMat);
      line.position.set(0, 2.5 - i * 0.45, 0.01);
      textLines.push(line);
      readerInterface.add(line);
    }

    readerInterface.visible = false;
    readerInterface.position.z = 0;
    scene.add(readerInterface);

    // =============================================
    // FILE FORMATS (SHOT 05)
    // =============================================
    const fileFormats = new THREE.Group();
    const formats = ['EPUB', 'PDF', 'MOBI', 'TXT', 'MD', 'CBZ'];
    const formatMeshes = [];

    formats.forEach((format, i) => {
      const cardGeo = new THREE.PlaneGeometry(1.2, 1.6);
      const cardMat = new THREE.MeshStandardMaterial({
        color: 0xf0f0f0,
        roughness: 0.7
      });
      const card = new THREE.Mesh(cardGeo, cardMat);
      card.position.set((i - 2.5) * 1.5, 0, 0);
      formatMeshes.push(card);
      fileFormats.add(card);
    });

    fileFormats.visible = false;
    scene.add(fileFormats);

    // =============================================
    // LIQUID GLASS UI (SHOT 06)
    // =============================================
    const glassUI = new THREE.Group();

    const glassPanels = [];
    for (let i = 0; i < 3; i++) {
      const panelGeo = new THREE.PlaneGeometry(4, 2.5);
      const panel = new THREE.Mesh(panelGeo, glassMaterial.clone());
      panel.position.set(0, (1 - i) * 1.5, i * 0.5);
      glassPanels.push(panel);
      glassUI.add(panel);
    }

    glassUI.visible = false;
    scene.add(glassUI);

    // =============================================
    // TEXT OVERLAY ELEMENTS
    // =============================================
    const titleEl = document.querySelector('.title');
    const subtitleEl = document.querySelector('.subtitle');
    const loadingEl = document.querySelector('.loading');

    // =============================================
    // ANIMATION TIMELINE
    // =============================================
    const timeline = gsap.timeline({
      onStart: () => {
        loadingEl.style.display = 'none';
      }
    });

    let currentTime = 0;

    // SHOT 01 — BLACK / LIGHT
    timeline.to(keyLight.position, {
      x: -2,
      duration: CONFIG.shot01Duration,
      ease: 'power2.inOut'
    }, currentTime);

    timeline.to(iconMesh.material, {
      opacity: CONFIG.glassOpacity,
      duration: CONFIG.shot01Duration * 0.8,
      ease: 'power2.out'
    }, currentTime + CONFIG.shot01Duration * 0.2);

    timeline.to(camera.position, {
      z: 12,
      duration: CONFIG.shot01Duration,
      ease: 'power1.inOut'
    }, currentTime);

    currentTime += CONFIG.shot01Duration;

    // SHOT 02 — LUMI ICON
    timeline.to(glowMesh.material, {
      opacity: 0.15,
      duration: 1.5,
      ease: 'power2.inOut'
    }, currentTime);

    timeline.to(lumiIcon.rotation, {
      y: Math.PI * 0.5,
      duration: CONFIG.shot02Duration,
      ease: 'power1.inOut'
    }, currentTime);

    timeline.to(iconMesh.scale, {
      x: 1.02,
      y: 1.02,
      z: 1.02,
      duration: 1.0,
      yoyo: true,
      repeat: 1,
      ease: 'sine.inOut'
    }, currentTime + 0.5);

    currentTime += CONFIG.shot02Duration;

    // SHOT 03 — BOOK TRANSFORMATION
    timeline.to(iconMesh.material, {
      opacity: 0,
      duration: 0.8,
      ease: 'power2.in'
    }, currentTime);

    timeline.to(glowMesh.material, {
      opacity: 0,
      duration: 0.8,
      ease: 'power2.in'
    }, currentTime);

    timeline.set(book, { visible: true }, currentTime + 0.5);

    timeline.from(book.scale, {
      x: 0.3,
      y: 0.3,
      z: 0.3,
      duration: 1.5,
      ease: 'back.out(1.2)'
    }, currentTime + 0.5);

    // Page turn animation
    pages.forEach((page, i) => {
      timeline.to(page.rotation, {
        y: -Math.PI * 0.9,
        duration: 1.2,
        ease: 'power2.inOut'
      }, currentTime + 1.8 + i * 0.3);
    });

    timeline.to(camera.position, {
      z: 8,
      duration: CONFIG.shot03Duration,
      ease: 'power1.inOut'
    }, currentTime);

    currentTime += CONFIG.shot03Duration;

    // SHOT 04 — READING INTERFACE
    timeline.to(book, {
      opacity: 0,
      duration: 1.0,
      onComplete: () => { book.visible = false; }
    }, currentTime);

    timeline.set(readerInterface, { visible: true }, currentTime + 0.5);

    timeline.from(readerInterface.scale, {
      x: 0.8,
      y: 0.8,
      z: 0.8,
      duration: 1.2,
      ease: 'power2.out'
    }, currentTime + 0.5);

    textLines.forEach((line, i) => {
      timeline.from(line.scale, {
        x: 0,
        duration: 0.6,
        ease: 'power2.out'
      }, currentTime + 1.0 + i * 0.05);
    });

    timeline.to(readerInterface.position, {
      y: 0.5,
      duration: CONFIG.shot04Duration * 0.6,
      ease: 'power1.inOut'
    }, currentTime + CONFIG.shot04Duration * 0.4);

    currentTime += CONFIG.shot04Duration;

    // SHOT 05 — FILE FORMATS
    timeline.to(readerInterface, {
      opacity: 0,
      duration: 0.8,
      onComplete: () => { readerInterface.visible = false; }
    }, currentTime);

    timeline.set(fileFormats, { visible: true }, currentTime + 0.3);

    formatMeshes.forEach((mesh, i) => {
      timeline.from(mesh.position, {
        z: -5,
        y: 3,
        duration: 1.2,
        ease: 'power2.out'
      }, currentTime + 0.5 + i * 0.15);

      timeline.to(mesh.rotation, {
        y: Math.PI * 2,
        duration: 2.0,
        ease: 'power1.inOut'
      }, currentTime + 1.0 + i * 0.15);
    });

    timeline.to(fileFormats.position, {
      z: 2,
      duration: CONFIG.shot05Duration * 0.5,
      ease: 'power1.inOut'
    }, currentTime + CONFIG.shot05Duration * 0.5);

    currentTime += CONFIG.shot05Duration;

    // SHOT 06 — LIQUID GLASS
    timeline.to(fileFormats, {
      opacity: 0,
      duration: 1.0,
      onComplete: () => { fileFormats.visible = false; }
    }, currentTime);

    timeline.set(glassUI, { visible: true }, currentTime + 0.5);

    glassPanels.forEach((panel, i) => {
      timeline.from(panel.position, {
        y: -3,
        z: -2,
        duration: 1.5,
        ease: 'power2.out'
      }, currentTime + 0.8 + i * 0.2);

      timeline.from(panel.material, {
        opacity: 0,
        duration: 1.0,
        ease: 'power1.out'
      }, currentTime + 0.8 + i * 0.2);
    });

    timeline.to(camera.position, {
      z: 6,
      duration: CONFIG.shot06Duration,
      ease: 'power1.inOut'
    }, currentTime);

    currentTime += CONFIG.shot06Duration;

    // SHOT 07 — DREAM
    timeline.to(glassUI, {
      opacity: 0,
      duration: 1.5,
      ease: 'power2.in'
    }, currentTime);

    timeline.to(titleEl, {
      opacity: 1,
      y: 0,
      duration: 2.0,
      ease: 'power2.out'
    }, currentTime + 0.5);

    timeline.to(subtitleEl, {
      opacity: 1,
      y: 0,
      duration: 2.0,
      ease: 'power2.out'
    }, currentTime + 1.0);

    timeline.to(camera.position, {
      z: 20,
      duration: CONFIG.shot07Duration,
      ease: 'power1.inOut'
    }, currentTime);

    timeline.to([titleEl, subtitleEl], {
      opacity: 0,
      duration: 1.5,
      ease: 'power2.in'
    }, currentTime + CONFIG.shot07Duration - 1.5);

    // =============================================
    // RENDER LOOP
    // =============================================
    function animate() {
      requestAnimationFrame(animate);

      // Subtle rotation for visible objects
      if (lumiIcon.visible) {
        lumiIcon.rotation.y += 0.001;
      }
      if (glassUI.visible) {
        glassUI.rotation.y += 0.002;
      }

      renderer.render(scene, camera);
    }

    // =============================================
    // WINDOW RESIZE
    // =============================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =============================================
    // START
    // =============================================
    animate();

    // Auto-play animation
    setTimeout(() => {
      timeline.play();
    }, 500);

    // Replay on 'R' key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') {
        timeline.restart();
      }
    });

  </script>
</body>
</html>
