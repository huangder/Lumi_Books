    <style>
        /* ═══ 反馈页专属布局（设计系统见 lumi-immersive.css） ═══ */
        .fb-wrap {
            width: min(calc(100% - 40px), 560px);
            margin: 0 auto;
            padding: clamp(56px, 8vw, 96px) 0 clamp(40px, 6vw, 72px);
            text-align: center;
        }
        .fb-wrap h1 { font-size: clamp(30px, 4vw, 42px); font-weight: 700; }
        .fb-sub {
            max-width: 420px;
            margin: 16px auto clamp(34px, 5vw, 48px);
            font-size: 16px;
            line-height: 1.85;
            color: var(--body-c);
        }
        .qr-card {
            max-width: 420px;
            margin: 0 auto;
            padding: clamp(28px, 4vw, 44px);
            border-radius: var(--radius-xl);
            overflow: hidden;
        }
        .qr-card::before {
            content: "";
            position: absolute;
            inset: -40% -30% auto;
            height: 180%;
            background: radial-gradient(50% 60% at 50% 0%, rgba(255, 56, 92, 0.13), transparent 70%);
            pointer-events: none;
        }
        .qr-card > * { position: relative; }
        .qr-card img {
            width: 240px;
            height: auto;
            border-radius: 16px;
            border: 1px solid var(--stroke-2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }
        .qr-card p { margin-top: 20px; font-size: 14.5px; line-height: 1.9; color: var(--body-c); }
        .qr-card a { color: var(--accent-strong); text-decoration: none; }
        .qr-card a:hover { text-decoration: underline; }
    </style>
    <link rel="stylesheet" href="lumi-immersive.css">
</head>

    </p>
